apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publisher
  template:
    metadata:
      labels:
        app: publisher
    spec:
      serviceAccountName: broadcaster-sa
      containers:
        - name: publisher
          image: publisher:latest
          imagePullPolicy: Never # this is for the weird minikube docker issue, if found a fix can be replaced
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: publisher
spec:
  selector:
    app: publisher
  ports:
    - port: 8081
      targetPort: 8081
