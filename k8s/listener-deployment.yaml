apiVersion: apps/v1
kind: Deployment
metadata:
  name: listener
spec:
  replicas: 3
  selector:
    matchLabels:
      app: listener
  template:
    metadata:
      labels:
        app: listener
    spec:
      containers:
        - name: listener
          image: listener:latest
          imagePullPolicy: Never # this is for the weird minikube docker issue, if found a fix can be replaced
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: listener
spec:
  selector:
    app: listener
  ports:
    - port: 8080
      targetPort: 8080
